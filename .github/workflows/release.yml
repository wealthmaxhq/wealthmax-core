name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      JWT_SECRET: release-only-jwt-secret-not-for-production-1234567890
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve and verify version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/verify-release.js "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          dart pub get

      - name: Validate Dart SDK
        run: |
          dart format --output=none --set-exit-if-changed lib test bin
          dart analyze --fatal-infos
          dart test

      - name: Validate backend
        run: |
          pnpm --filter wealth-planner-backend run typecheck
          pnpm --filter wealth-planner-backend run build
          pnpm --filter wealth-planner-backend test

      - name: Validate and build frontend
        run: |
          pnpm --filter wealth-planner-frontend run typecheck
          pnpm --filter wealth-planner-frontend test
          pnpm --filter wealth-planner-frontend run build

      - name: Package release artifacts
        run: |
          mkdir -p release/staging/backend
          cp -R backend/dist backend/package.json release/staging/backend/
          tar -C frontend/dist -czf "release/wealthmax-frontend-v${VERSION}.tar.gz" .
          tar -C release/staging/backend -czf "release/wealthmax-backend-v${VERSION}.tar.gz" .
          tar -czf "release/wealthmax-dart-sdk-v${VERSION}.tar.gz" \
            lib bin pubspec.yaml pubspec.lock README.md LICENSE CHANGELOG.md
          cd release
          sha256sum wealthmax-*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/wealthmax-*.tar.gz
          release/SHA256SUMS
          --verify-tag
          --title "WealthMax v${VERSION}"
          --generate-notes
