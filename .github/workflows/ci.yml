name: Full-stack CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-quality:
    name: Dart formatting and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Cache Dart packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test bin

      - name: Analyze Dart code
        run: dart analyze --fatal-infos

      - name: Verify every Dart test is assigned to a tier
        shell: bash
        run: |
          find test -type f -name '*_test.dart' -print | sort > /tmp/all-dart-tests.txt
          find \
            test/calculation \
            test/currency \
            test/health \
            test/investment \
            test/loan \
            test/money \
            test/percentage \
            test/rounding \
            test/decision \
            test/reporting \
            -type f -name '*_test.dart' -print | sort > /tmp/tiered-dart-tests.txt
          diff -u /tmp/all-dart-tests.txt /tmp/tiered-dart-tests.txt

  dart-core-tests:
    name: Dart core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Cache Dart packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run core financial tests
        run: >-
          dart test
          test/calculation
          test/currency
          test/health
          test/investment
          test/loan
          test/money
          test/percentage
          test/rounding

  dart-advanced-tests:
    name: Dart decision and reporting tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Cache Dart packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run decision and reporting tests
        run: dart test test/decision test/reporting

  backend-quality:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check backend
        run: pnpm --filter wealth-planner-backend run typecheck

      - name: Verify release metadata stays aligned
        run: node scripts/verify-release.js

      - name: Build backend
        run: pnpm --filter wealth-planner-backend run build

      - name: Verify every backend test is assigned to a tier
        run: pnpm --filter wealth-planner-backend run test:verify-tiers

  backend-fast-tests:
    name: Backend fast API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fast backend tests
        run: pnpm --filter wealth-planner-backend run test:fast

  backend-dart-bridge-tests:
    name: Backend Dart bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Dart for calculation bridges
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Dart dependencies
        run: dart pub get
      - name: Run backend Dart bridge tests
        run: pnpm --filter wealth-planner-backend run test:dart-bridge

  frontend:
    name: Frontend web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm --filter wealth-planner-frontend run typecheck

      - name: Test frontend
        run: pnpm --filter wealth-planner-frontend test

      - name: Build frontend
        run: pnpm --filter wealth-planner-frontend run build
